# iot-verifier settings template.
#
# Values shown are the defaults; commented keys are optional. Any value can be
# overridden with a VERIFY__<SECTION>__<KEY> environment variable (double
# underscore separates nested keys), e.g. VERIFY__DATABASE__URL.

# RUST_LOG compatible log filter. Default below.
# log = "iot_verifier=debug"

# Reward period (how much time each reward epoch covers). Default 24 hours.
# reward_period = "24 hours"

# Delay after the end of a reward period before rewards are calculated.
# Default 30 minutes.
# reward_period_offset = "30 minutes"

# Max lookback age for the packet loader's file window. Default 1 hour.
# loader_window_max_lookback_age = "1 hour"

# Poll interval for incoming HPR packet files. Default 15 minutes.
# packet_interval = "15 minutes"

# How often the cached gateways are refreshed from iot-config. Default 30 minutes.
# gateway_refresh_interval = "30 minutes"

# File store clients (read side). Required.
[file_store_clients]

# Bucket the verifier reads HPR data-transfer packet reports from. Required.
[file_store_clients.packet_input]
bucket = "mainnet-iot-packet-ingest"
# region = "us-west-2"
# endpoint = "https://s3.us-west-2.amazonaws.com"

# Every bucket a rolled file is written to, keyed by a label you choose, and
# the directory they stage under. At least one bucket is required. Two buckets
# means the same file, byte for byte and under the same key, lands in both.
#
# The label is not the bucket name: the bucket name goes in the entry. Labels
# exist so credentials can come from the environment -- bucket names are
# hyphenated and hyphens cannot appear in an environment variable name:
#
#   VERIFY__FILE_UPLOAD__BUCKETS__R2__SECRET_ACCESS_KEY=<secret>
#
# Each entry carries its own region, endpoint and credentials and inherits
# nothing from the others, which is what lets one bucket live on a different
# provider than another -- a Cloudflare R2 mirror of an S3 primary. For R2 the
# region is "auto" and the key pair is an R2 API token, not the AWS one.
#
# Set both access_key_id and secret_access_key or neither. With only one of
# them the S3 client silently ignores both and falls back to the ambient AWS
# credential chain, which cannot authenticate against R2 -- so the service
# refuses to start rather than failing every upload later.
#
# A file is removed from a bucket's directory only once that bucket has stored
# it, and each bucket retries on its own: one that is failing can neither hold
# up nor delete another's copy, and picks up its own backlog on restart.

[file_upload]
# Directory the file sinks write into, and under which each bucket stages its
# own <root>/<label>_<bucket>/ subdirectory. Required -- this was previously
# `file_store_clients.cache`.
root = "/var/data/iot-verified"

[file_upload.buckets.s3]
bucket = "mainnet-iot-verified"
# region = "us-west-2"
# endpoint = "https://s3.us-west-2.amazonaws.com"

# [file_upload.buckets.r2]
# bucket = "mainnet-iot-verified-mirror"
# endpoint = "https://<account_id>.r2.cloudflarestorage.com"
# region = "auto"
# access_key_id = "<r2 access key id>"
# secret_access_key = "<r2 secret access key>"

[database]
# Postgres connection string. Required.
url = "postgres://postgres:postgres@127.0.0.1:5432/iot_verifier"
# max_connections = 10

# iot-config gRPC client (sub-dao reward info + gateway lookups). Required.
[iot_config_client]
url = "http://127.0.0.1:8080"
# Keypair used to sign requests to iot-config.
signing_keypair = "/etc/iot-verifier/signing_keypair.bin"
# b58 public key of the iot-config server, used to verify its responses.
config_pubkey = ""

# Price tracker (reads HNT price reports from the price oracle). Required.
[price_tracker]
# price_duration_minutes = 60

[price_tracker.bucket]
bucket = "mainnet-price"
# region = "us-west-2"
# endpoint = "https://s3.us-west-2.amazonaws.com"

[metrics]
# Prometheus scrape endpoint. Default below.
# endpoint = "127.0.0.1:19000"

# Iceberg connection settings, used by `backfill-rewards`. Optional; the
# `server` subcommand does not need this section.
#
# [iceberg_settings]
# catalog_uri = "https://iceberg-catalog.example/catalog"
# catalog_name = "helium"
# warehouse = "s3://iceberg-warehouse/"
#
# [iceberg_settings.auth]
# # token = "..."           # static OAuth2 token
# # credential = "..."      # OAuth2 client_id:client_secret
# # oauth2_server_uri = "..."
# # scope = "..."
#
# [iceberg_settings.s3]
# # endpoint = "https://s3.us-west-2.amazonaws.com"
# # region = "us-west-2"
# # access_key_id = "..."
# # secret_access_key = "..."
# # path_style_access = false
# # disable_config_load = false
