# Trino catalog for the Solana on-chain indexer database.
#
# iot-config's sub-DAO service reads each epoch's reward info through this catalog:
#   solana.public.sub_dao_epoch_infos (hnt_rewards_issued, delegation_rewards_issued)
#
# In a real deployment `connection-url` must point at the Solana on-chain indexer
# Postgres (the database iot-config used to connect to directly as its [metadata]
# pool). The local value below just reuses the dev postgres.
#
# NOTE: like the sibling iceberg/postgres files, this is NOT loaded by the local
# Trino — `infra/trino/etc/config.properties` sets `catalog.management=dynamic`
# with `catalog.store=memory`, so static catalog files are ignored and catalogs are
# created at runtime via `CREATE CATALOG`. It is checked in to document the catalog
# a real deployment must expose. Integration tests don't need it either: they seed
# fixtures into a per-test Iceberg catalog and pass the schema in as an override.
connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/postgres
connection-user=postgres
connection-password=postgres
