
# log settings for the application (RUST_LOG format). Default below
# 
# log = "iot_packet_verifier=debug"

# Local scratch directory. Roots the iceberg backfill spool; the file sinks
# and their uploaders live under `file_upload.root` instead. Required.
cache = "/var/data/verified-reports"

# URL for the config server
org_url = ""

# Path to the keypair used to authorize config server rpc calls
config_keypair = ""

# We will burn data credits from the solana chain every `burn_period` minutes.
burn_period = 1

# If set to true, enables integration with the Solana network. This includes
# checking payer balances and burning data credits. If this is disabled, all
# payers will have a default balance of 1,000,000 data credits, and burned
# data credits will only be stored in the database. This is set to false by
# default.
enable_solana_integration = "false"

# Minimum number of DC left in a balance before we disable the organization.
# Defaults to 3_500_000 DC, which equates to $35
minimum_allowed_balance = 3_500_000

# How often we should check the organizations to see if they have repleneshed
# their funds in minutes. Defaults to 30 minutes.
monitor_funds_period = 30

[solana]
# Solana RPC. This may contain a secret 
rpc_url = "http://localhost:8899"
# Path to the keypair used to sign data credit burn solana transactions
burn_keypair = ""
# Solana cluster to use. "devnet" or "mainnet"
cluster = "devnet"
# Public key for the Data Credits Mint
dc_mint = "dcuc8Amr83Wz27ZkQ2K9NS6r8zRpf1J6cvArEBDZDmm"
# Public key for the DNT Mint (IOT mint)
dnt_mint = "iotEVVZLEywoTn1QdwNPddxPWszn3zFhEot3MfL9fns"

[database]

url = "postgresql://postgres:password@localhost:5432/postgres"

# Max connections to the database. Default below
#
# max_connections = 10

[ingest]

# Input bucket details for ingest data 

# Name of bucket to access ingest data. Required
#
bucket = "helium-hpr-alpha"

# Region for bucket. Defaults to below
#
region = "us-west-1"

# Optional URL for AWS api endpoint. Inferred from aws config settings or aws
# IAM context by default
#
# endpoint = "https://aws-s3-bucket.aws.com"

# Every bucket a rolled file is written to, keyed by a label you choose, and
# the directory they stage under. At least one bucket is required. Two buckets
# means the same file, byte for byte and under the same key, lands in both.
#
# The label is not the bucket name: the bucket name goes in the entry. Labels
# exist so credentials can come from the environment -- bucket names are
# hyphenated and hyphens cannot appear in an environment variable name:
#
#   PACKET_VERIFY__FILE_UPLOAD__BUCKETS__R2__SECRET_ACCESS_KEY=<secret>
#
# Each entry carries its own region, endpoint and credentials and inherits
# nothing from the others, which is what lets one bucket live on a different
# provider than another -- a Cloudflare R2 mirror of an S3 primary. For R2 the
# region is "auto" and the key pair is an R2 API token, not the AWS one.
#
# Set both access_key_id and secret_access_key or neither. With only one of
# them the S3 client silently ignores both and falls back to the ambient AWS
# credential chain, which cannot authenticate against R2 -- so the service
# refuses to start rather than failing every upload later.
#
# A file is removed from a bucket's directory only once that bucket has stored
# it, and each bucket retries on its own: one that is failing can neither hold
# up nor delete another's copy, and picks up its own backlog on restart.

[file_upload]
# Directory the file sinks write into, and under which each bucket stages its
# own <root>/<label>_<bucket>/ subdirectory. Required -- verified packets used
# to stage under `cache`.
root = "/var/data/verified-reports"

[file_upload.buckets.s3]
bucket = "mainnet-iot-packet-verifier"
# region = "us-west-2"
# endpoint = "https://s3.us-west-2.amazonaws.com"

# [file_upload.buckets.r2]
# bucket = "mainnet-iot-packet-verifier-mirror"
# endpoint = "https://<account_id>.r2.cloudflarestorage.com"
# region = "auto"
# access_key_id = "<r2 access key id>"
# secret_access_key = "<r2 secret access key>"

[metrics]

# Endpoint for metrics. Default below
#
# endpoint = "127.0.0.1:19000"

# Iceberg connection settings, used by `backfill-valid-packets`.
# Optional; the `server` subcommand does not need this section.
#
# [iceberg_settings]
# catalog_uri = "https://iceberg-catalog.example/catalog"
# catalog_name = "helium"
# warehouse = "s3://iceberg-warehouse/"
#
# [iceberg_settings.auth]
# # token = "..."           # static OAuth2 token
# # credential = "..."      # OAuth2 client_id:client_secret
# # oauth2_server_uri = "..."
# # scope = "..."
#
# [iceberg_settings.s3]
# # endpoint = "https://s3.us-west-2.amazonaws.com"
# # region = "us-west-2"
# # access_key_id = "..."
# # secret_access_key = "..."
# # path_style_access = false
# # disable_config_load = false
