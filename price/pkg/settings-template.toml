# RUST_LOG compatible settings string. Default below
#
# log = "price=info,file_store=info"

# Hermes price update URL including the HNT feed id query parameter. Default
# below.
#
# source = "https://pyth.dourolabs.app/hermes/v2/updates/price/latest?ids[]=649fdd7ec08e8e2a20f425729854e90293dcbe2376abc47197a14da6ff339756"

# Bearer token sent in the `Authorization` header when fetching `source`.
# Required. Prefer setting this via the `PRICE__API_KEY` environment variable
# rather than in the config file.
#
# api_key = "..."

# Folder holding the last-known-good price file. Not an upload staging area --
# that is `file_upload.root`. Default below.
#
# cache = "/opt/price/data"

# Price tick interval. Default = 60s. Optional.
interval = "60 seconds"

# How long to keep using the last successfully-fetched price after Hermes
# fetches start failing. Default = 12 hours. Optional.
#
# stale_price_duration = "12 hours"

# Static HNT price override (8-decimal integer, e.g. $1 = 100000000). When set,
# the service emits this value every tick instead of calling the Hermes API.
# Intended for testing. Optional.
#
# default_price =


[custom_tracing]
# File watched for runtime tracing-config reloads. Default below.
#
# tracing_cfg_file = "tracing.cfg"


# Every bucket a rolled file is written to, keyed by a label you choose, and
# the directory they stage under. At least one bucket is required. Two buckets
# means the same file, byte for byte and under the same key, lands in both.
#
# The label is not the bucket name: the bucket name goes in the entry. Labels
# exist so credentials can come from the environment -- bucket names are
# hyphenated and hyphens cannot appear in an environment variable name:
#
#   PRICE__FILE_UPLOAD__BUCKETS__R2__SECRET_ACCESS_KEY=<secret>
#
# Each entry carries its own region, endpoint and credentials and inherits
# nothing from the others, which is what lets one bucket live on a different
# provider than another -- a Cloudflare R2 mirror of an S3 primary. For R2 the
# region is "auto" and the key pair is an R2 API token, not the AWS one.
#
# Set both access_key_id and secret_access_key or neither. With only one of
# them the S3 client silently ignores both and falls back to the ambient AWS
# credential chain, which cannot authenticate against R2 -- so the service
# refuses to start rather than failing every upload later.
#
# A file is removed from a bucket's directory only once that bucket has stored
# it, and each bucket retries on its own: one that is failing can neither hold
# up nor delete another's copy, and picks up its own backlog on restart.

[file_upload]
# Directory the price sink writes into, and under which each bucket stages its
# own <root>/<label>_<bucket>/ subdirectory. Required.
root = "/opt/price/data"

[file_upload.buckets.s3]
bucket = "price"
# region = "us-west-2"
# endpoint = "https://s3.us-west-2.amazonaws.com"

# [file_upload.buckets.r2]
# bucket = "price-mirror"
# endpoint = "https://<account_id>.r2.cloudflarestorage.com"
# region = "auto"
# access_key_id = "<r2 access key id>"
# secret_access_key = "<r2 secret access key>"


[metrics]
# Prometheus scrape endpoint. Default below.
#
# endpoint = "127.0.0.1:19000"
